name: Build APK and Web

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # FIXED: Forces the lowercase project name so the folder name doesn't crash it
      - name: Generate Android files
        run: flutter create --project-name niggatrader --platforms=android .

      - name: Download SF Pro Fonts
        run: |
          mkdir -p fonts
          curl -sL "https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/master/SF-Pro-Text-Regular.otf" -o fonts/SF-Pro-Text-Regular.otf
          curl -sL "https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/master/SF-Pro-Text-Medium.otf" -o fonts/SF-Pro-Text-Medium.otf
          curl -sL "https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/master/SF-Pro-Display-Semibold.otf" -o fonts/SF-Pro-Display-Semibold.otf

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-journal-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # FIXED: Forces the lowercase project name here too
      - name: Generate Web files
        run: flutter create --project-name niggatrader --platforms=web .

      - name: Download SF Pro Fonts
        run: |
          mkdir -p fonts
          curl -sL "https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/master/SF-Pro-Text-Regular.otf" -o fonts/SF-Pro-Text-Regular.otf
          curl -sL "https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/master/SF-Pro-Text-Medium.otf" -o fonts/SF-Pro-Text-Medium.otf
          curl -sL "https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/master/SF-Pro-Display-Semibold.otf" -o fonts/SF-Pro-Display-Semibold.otf

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
